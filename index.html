<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5532c">
<title>Nos recettes</title>
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --fg:#2b2622; --muted:#7d7168; --line:#ece4d9;
  --accent:#b5532c; --accent-2:#e9b949; --chip:#f3ece2; --shadow:0 6px 20px rgba(60,40,20,.08);
  --sale:#2f7a5b; --sucre:#c2557a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1816; --card:#25211e; --fg:#f2ece6; --muted:#a39a90; --line:#3a332d;
    --accent:#e4875c; --accent-2:#e9b949; --chip:#302a25; --shadow:0 6px 20px rgba(0,0,0,.35);
    --sale:#5fbf93; --sucre:#e88ab0;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1816; --card:#25211e; --fg:#f2ece6; --muted:#a39a90; --line:#3a332d;
  --accent:#e4875c; --accent-2:#e9b949; --chip:#302a25; --shadow:0 6px 20px rgba(0,0,0,.35);
  --sale:#5fbf93; --sucre:#e88ab0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 110px}

/* En-tête */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:clamp(1.6rem,4vw,2.1rem);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.head-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-add,.btn-liste{border:none;border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn-add{background:var(--accent);color:#fff}
.btn-liste{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn-liste .n{display:inline-block;min-width:22px;padding:1px 7px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:.8rem}
.btn-add:hover,.btn-liste:hover{filter:brightness(1.05)}

/* Plat au hasard */
.hasard{display:flex;justify-content:center;margin:0 0 16px}
.btn-hasard{background:var(--card);color:var(--fg);border:1px solid var(--accent);border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn-hasard:hover{background:var(--accent);color:#fff}

/* Recherche et filtres */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:13px 16px 13px 42px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.25rem;pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.group{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 13px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sale[aria-pressed="true"]{background:var(--sale);border-color:var(--sale)}
.chip.sucre[aria-pressed="true"]{background:var(--sucre);border-color:var(--sucre)}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;justify-content:space-between}
#count{color:var(--muted);font-size:.9rem}

/* Grille de cartes */
#grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s ease;position:relative}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.visu{height:130px;display:grid;place-items:center;font-size:3rem;position:relative}
.visu img{width:100%;height:100%;object-fit:cover;display:block}
.visu.sale{background:linear-gradient(135deg,#dff0e8,#f5e6c8)}
.visu.sucre{background:linear-gradient(135deg,#fde2ec,#f7e6d0)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .visu.sale{background:linear-gradient(135deg,#21382f,#3a3224)}
  :root:not([data-theme="light"]) .visu.sucre{background:linear-gradient(135deg,#3b2430,#3a2e25)}
}
:root[data-theme="dark"] .visu.sale{background:linear-gradient(135deg,#21382f,#3a3224)}
:root[data-theme="dark"] .visu.sucre{background:linear-gradient(135deg,#3b2430,#3a2e25)}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h2{font-size:1.05rem;margin:0;line-height:1.3}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.76rem;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.sale{background:var(--sale);color:#fff}
.badge.sucre{background:var(--sucre);color:#fff}
.preview{color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:8px}
.pick{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.92);color:#2b2622;border:none;border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pick[aria-pressed="true"]{background:var(--accent);color:#fff}

.etoile{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,.92);color:#b8860b;border:none;border-radius:999px;padding:6px 11px;font-size:.88rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.etoile[aria-pressed="true"]{background:#f6c945;color:#2b2622}
.btn-etoile{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn-etoile[aria-pressed="true"]{background:#f6c945;color:#2b2622;border-color:#f6c945}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px;border:1px dashed var(--line);border-radius:18px}
.empty strong{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:6px}

/* Dialogues */
dialog{border:none;padding:0;background:var(--card);color:var(--fg);border-radius:20px;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,14,10,.55)}
.dlg{padding:22px 22px 18px;overflow:auto;max-height:calc(100vh - 32px)}
.dlg-photo{height:200px;margin:-22px -22px 16px;display:grid;place-items:center;font-size:4rem;overflow:hidden}
.dlg-photo img{width:100%;height:100%;object-fit:cover;display:block}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.dlg-head h2{margin:0;font-size:1.35rem;line-height:1.25}
.x{background:var(--chip);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.fact{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;font-size:1.05rem}
.fact span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:20px 0 8px}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.ing label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:10px;cursor:pointer}
.ing label:hover{background:var(--chip)}
.ing input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.ing .done{opacity:.45;text-decoration:line-through}
.steps{padding-left:0;list-style:none;margin:0;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);background:var(--accent-2);color:#2b2622;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem}
.notes{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap}
.src{display:inline-block;margin-top:14px;color:var(--accent);font-weight:600;text-decoration:none;word-break:break-all}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.btn-ajout{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn-ajout[aria-pressed="true"]{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.hint{font-size:.8rem;color:var(--muted)}

/* Liste de courses */
.liste-recette{margin-bottom:18px}
.liste-recette h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.liste-recette .retirer{background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:.8rem;text-transform:none;letter-spacing:0}
.liste-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.liste-actions button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.liste-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.vide{color:var(--muted);text-align:center;padding:24px 0}

/* Formulaire */
.form-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}
label.l{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
textarea.f{min-height:88px;resize:vertical}
.submit{margin-top:16px;width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-size:1rem}
.submit:disabled{opacity:.55;cursor:wait}
.msg{font-size:.88rem;margin-top:10px;color:var(--muted);min-height:1.2em}
.msg.err{color:#c0392b}

/* Chargement */
.skeleton{background:linear-gradient(90deg,var(--card),var(--chip),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px;height:200px;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:520px){
  .form-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(3,1fr)}
  .fab-text{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Nos recettes</h1>
      <div class="sub">Ce qu'on cuisine, ce qu'on aime, ce qu'on veut refaire</div>
    </div>
    <div class="head-btns">
      <button class="btn-liste" id="openListe" type="button">🛒 Liste de courses <span class="n" id="nListe">0</span></button>
      <button class="btn-add" id="openAdd" type="button">+ <span class="fab-text">Ajouter</span></button>
    </div>
  </header>

  <div class="hasard">
    <button class="btn-hasard" id="hasard" type="button">🎲 Un plat salé au hasard</button>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="Chercher un titre ou un ingrédient…" aria-label="Rechercher">
  </div>

  <div class="filters" role="group" aria-label="Filtres">
    <div class="group" id="fType">
      <button class="chip" type="button" data-v="tous" aria-pressed="true">Tout</button>
      <button class="chip sucre" type="button" data-v="sucre" aria-pressed="false">Sucré</button>
      <button class="chip sale" type="button" data-v="sale" aria-pressed="false">Salé</button>
    </div>
    <div class="group" id="fViande">
      <button class="chip" type="button" data-v="tous" aria-pressed="true">Toutes viandes</button>
      <button class="chip" type="button" data-v="viande" aria-pressed="false">Viande</button>
      <button class="chip" type="button" data-v="poisson" aria-pressed="false">Poisson</button>
      <button class="chip" type="button" data-v="vegetarien" aria-pressed="false">Végétarien</button>
      <button class="chip" type="button" data-v="vegan" aria-pressed="false">Végan</button>
    </div>
    <div class="group">
      <button class="chip" id="souhaitsOnly" type="button" aria-pressed="false">★ Souhaits</button>
    </div>
  </div>

  <div class="row2">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select class="sel" id="fCuisine" aria-label="Cuisine"><option value="tous">Toutes les cuisines</option></select>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="count" aria-live="polite">Chargement…</span>
      <select class="sel" id="sort" aria-label="Trier">
        <option value="titre">A → Z</option>
        <option value="recent">Plus récentes</option>
      </select>
    </div>
  </div>

  <div id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<!-- Détail d'une recette -->
<dialog id="detail" aria-labelledby="dTitle">
  <div class="dlg" id="dBody"></div>
</dialog>

<!-- Liste de courses -->
<dialog id="listeDlg" aria-labelledby="lTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="lTitle">🛒 Liste de courses</h2>
      <button class="x" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <div id="lBody"></div>
  </div>
</dialog>

<!-- Ajout d'une recette -->
<dialog id="addDlg" aria-labelledby="aTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="aTitle">Nouvelle recette</h2>
      <button class="x" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <form id="form">
      <div class="form-grid">
        <div class="full"><label class="l" for="f_titre">Titre *</label><input class="f" id="f_titre" name="titre" required></div>
        <div><label class="l" for="f_type">Type</label>
          <select class="f" id="f_type" name="type"><option value="sale">Salé</option><option value="sucre">Sucré</option></select></div>
        <div><label class="l" for="f_viande">Viande</label>
          <select class="f" id="f_viande" name="viande"><option value="viande">Viande</option><option value="poisson">Poisson</option><option value="vegetarien">Végétarien</option><option value="vegan">Végan</option></select></div>
        <div><label class="l" for="f_cuisine">Cuisine</label><input class="f" id="f_cuisine" name="cuisine" list="cuisines" placeholder="japonaise, coréenne…"><datalist id="cuisines"></datalist></div>
        <div><label class="l" for="f_difficulte">Difficulté</label>
          <select class="f" id="f_difficulte" name="difficulte"><option value="">—</option><option>facile</option><option>moyen</option><option>difficile</option></select></div>
        <div><label class="l" for="f_temps">Temps (min)</label><input class="f" id="f_temps" name="temps" type="number" min="0"></div>
        <div><label class="l" for="f_portions">Portions</label><input class="f" id="f_portions" name="portions" type="number" min="1"></div>
        <div><label class="l" for="f_ajoute">Ajouté par</label><input class="f" id="f_ajoute" name="ajoute_par" placeholder="ton prénom"></div>
        <div class="full"><label class="l" for="f_source">Lien source</label><input class="f" id="f_source" name="source" type="url" placeholder="https://…"></div>
        <div class="full"><label class="l" for="f_image">Lien d'une photo (facultatif)</label><input class="f" id="f_image" name="image_url" type="url" placeholder="https://…/photo.jpg"></div>
        <div class="full"><label class="l" for="f_ing">Ingrédients</label><textarea class="f" id="f_ing" name="ingredients" placeholder="Un ingrédient par ligne"></textarea></div>
        <div class="full"><label class="l" for="f_etapes">Étapes</label><textarea class="f" id="f_etapes" name="etapes" placeholder="Une étape par ligne"></textarea><div class="hint">Une ligne = une étape. Les étapes sont numérotées automatiquement.</div></div>
        <div class="full"><label class="l" for="f_notes">Notes</label><textarea class="f" id="f_notes" name="notes" style="min-height:64px"></textarea></div>
      </div>
      <button class="submit" id="save" type="submit">Enregistrer la recette</button>
      <div class="msg" id="formMsg" aria-live="polite"></div>
    </form>
  </div>
</dialog>

<script>
// ---- Configuration Supabase (clé publique, prévue pour le navigateur) ----
const CFG = {
  url: 'https://ravmmggdctdidjuibmua.supabase.co',
  key: 'sb_publishable_KdYYG447WNcOcUi6BN0GwA_NrdNgLgq'
};
const TABLE = 'recettes';

const LABEL_VIANDE = {viande:'Viande', poisson:'Poisson', vegetarien:'Végétarien', vegan:'Végan'};
const LABEL_TYPE = {sucre:'Sucré', sale:'Salé'};
const EMOJI_CUISINE = {
  japonaise:'🍣', coréenne:'🥢', chinoise:'🥟', vietnamienne:'🍜', thaïlandaise:'🍛', indienne:'🍛',
  indonésienne:'🍢', asiatique:'🥡', italienne:'🍝', française:'🥖', alsacienne:'🥧', libanaise:'🥗',
  argentine:'🥩', 'ouest-africaine':'🍲'
};

const state = { recipes: [], type: 'tous', viande: 'tous', cuisine: 'tous', q: '', sort: 'titre', souhaitsOnly: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = v => String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
const dateFr = iso => iso ? new Date(iso).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) : '';
const emojiFor = r => EMOJI_CUISINE[r.cuisine] || (r.type === 'sucre' ? '🍰' : '🍽️');

// ---- Stockage local (sélection et cases cochées), tolérant aux erreurs ----
function lsGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let selection = lsGet('liste-selection', []);       // ids des recettes choisies
let coches = lsGet('liste-cochees', {});            // { "id|index": true }

function saveSelection() { lsSet('liste-selection', selection); updateListeCount(); }
function updateListeCount() { $('nListe').textContent = selection.length; }

async function api(path, opts = {}) {
  const res = await fetch(`${CFG.url}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: CFG.key, Authorization: `Bearer ${CFG.key}`, ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadRecipes() {
  try {
    state.recipes = await api(`${TABLE}?select=*&order=titre.asc`);
    // on retire de la sélection les recettes supprimées
    const ids = new Set(state.recipes.map(r => r.id));
    const avant = selection.length;
    selection = selection.filter(id => ids.has(id));
    if (selection.length !== avant) saveSelection();
    updateCuisineOptions();
    render();
  } catch (e) {
    $('count').textContent = 'Erreur de chargement';
    $('grid').innerHTML = `<div class="empty"><strong>Impossible de charger les recettes</strong>${esc(e.message)}</div>`;
  }
}

function updateCuisineOptions() {
  const cuisines = [...new Set(state.recipes.map(r => r.cuisine).filter(Boolean))].sort();
  const sel = $('fCuisine');
  const cur = state.cuisine;
  sel.innerHTML = '<option value="tous">Toutes les cuisines</option>' +
    cuisines.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = cuisines.includes(cur) ? cur : 'tous';
  state.cuisine = sel.value;
  $('cuisines').innerHTML = cuisines.map(c => `<option value="${esc(c)}">`).join('');
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = state.recipes.filter(r => {
    if (state.type !== 'tous' && r.type !== state.type) return false;
    if (state.viande !== 'tous' && r.viande !== state.viande) return false;
    if (state.cuisine !== 'tous' && r.cuisine !== state.cuisine) return false;
    if (state.souhaitsOnly && !souhaitsDe(r).length) return false;
    if (q) {
      const hay = [r.titre, r.cuisine, ...(r.ingredients || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (state.sort === 'recent') list.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  else list.sort((a, b) => String(a.titre).localeCompare(String(b.titre), 'fr'));
  return list;
}

function visuHtml(r) {
  if (r.image_url) return `<img src="${esc(r.image_url)}" alt="${esc(r.titre)}" loading="lazy">`;
  return emojiFor(r);
}

function render() {
  const list = filtered();
  const total = state.recipes.length;
  $('count').textContent = total
    ? (list.length === total ? `${total} recette${total > 1 ? 's' : ''}` : `${list.length} sur ${total}`)
    : '';

  if (!total) {
    $('grid').innerHTML = `<div class="empty"><strong>Pas encore de recette</strong>Appuie sur « Ajouter » pour commencer.</div>`;
    return;
  }
  if (!list.length) {
    $('grid').innerHTML = `<div class="empty"><strong>Aucune recette ne correspond</strong>Essaie d'enlever un filtre.</div>`;
    return;
  }

  $('grid').innerHTML = list.map(r => {
    const picked = selection.includes(r.id);
    const badges = [
      r.type && `<span class="badge ${esc(r.type)}">${LABEL_TYPE[r.type] || ''}</span>`,
      r.viande && `<span class="badge">${LABEL_VIANDE[r.viande] || ''}</span>`,
      r.cuisine && `<span class="badge">${esc(r.cuisine)}</span>`,
      r.difficulte && `<span class="badge">${esc(r.difficulte)}</span>`
    ].filter(Boolean).join('');
    const preview = (r.ingredients || []).slice(0, 4).join(' · ');
    return `<article class="card" tabindex="0" data-id="${esc(r.id)}" role="button" aria-label="Ouvrir ${esc(r.titre)}">
      <button class="etoile" type="button" data-etoile="${esc(r.id)}" aria-pressed="${estSouhait(r)}" title="Je veux refaire / essayer ça">${etoileLabel(r)}</button>
      <button class="pick" type="button" data-pick="${esc(r.id)}" aria-pressed="${picked}" title="Ajouter à la liste de courses">${picked ? '✓ Dans la liste' : '+ Liste'}</button>
      <div class="visu ${esc(r.type || 'sale')}">${visuHtml(r)}</div>
      <div class="card-body">
        <h2>${esc(r.titre)}</h2>
        <div class="badges">${badges}</div>
        ${preview ? `<div class="preview">${esc(preview)}</div>` : ''}
        <div class="foot">
          <span>${r.temps ? esc(r.temps) + ' min' : ''}</span>
          <span>${r.ajoute_par ? 'par ' + esc(r.ajoute_par) : ''} ${dateFr(r.created_at)}</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

// ---- Filtres ----
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('fCuisine').addEventListener('change', e => { state.cuisine = e.target.value; render(); });

function bindGroup(id, key) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state[key] = b.dataset.v;
    $(id).querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    render();
  });
}
bindGroup('fType', 'type');
bindGroup('fViande', 'viande');

// ---- Sélection pour la liste de courses ----
function togglePick(id) {
  selection = selection.includes(id) ? selection.filter(x => x !== id) : [...selection, id];
  saveSelection();
  render();
  if ($('listeDlg').open) renderListe();
}

$('grid').addEventListener('click', e => {
  const et = e.target.closest('[data-etoile]');
  if (et) { e.stopPropagation(); toggleSouhait(et.dataset.etoile); return; }
  const pick = e.target.closest('[data-pick]');
  if (pick) { e.stopPropagation(); togglePick(pick.dataset.pick); return; }
  const c = e.target.closest('.card'); if (c) openRecipe(c.dataset.id);
});
$('grid').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
    e.preventDefault(); openRecipe(e.target.dataset.id);
  }
});

// ---- Liste de courses ----
function renderListe() {
  const chosen = selection.map(id => state.recipes.find(r => r.id === id)).filter(Boolean);
  if (!chosen.length) {
    $('lBody').innerHTML = `<div class="vide">Ta liste est vide.<br>Clique sur « + Liste » sur les recettes qui t'intéressent.</div>`;
    return;
  }
  const blocs = chosen.map(r => {
    const items = (r.ingredients || []).map((i, idx) => {
      const k = `${r.id}|${idx}`;
      const ok = !!coches[k];
      return `<li><label>
        <input type="checkbox" data-k="${esc(k)}" ${ok ? 'checked' : ''}>
        <span class="${ok ? 'done' : ''}">${esc(i)}</span>
      </label></li>`;
    }).join('');
    return `<div class="liste-recette">
      <h3><span>${esc(r.titre)}</span><button class="retirer" type="button" data-retirer="${esc(r.id)}">retirer</button></h3>
      ${items ? `<ul class="ing">${items}</ul>` : '<div class="hint">Pas d’ingrédients renseignés.</div>'}
    </div>`;
  }).join('');
  $('lBody').innerHTML = blocs + `
    <div class="liste-actions">
      <button class="primary" type="button" id="copier">Copier la liste</button>
      <button type="button" id="cocherTout">Tout décocher</button>
      <button type="button" id="viderListe">Vider la liste</button>
    </div>
    <div class="hint" id="copieMsg" style="margin-top:8px"></div>`;
}

function openListe() {
  renderListe();
  $('listeDlg').showModal();
}

$('openListe').addEventListener('click', openListe);

$('lBody').addEventListener('change', e => {
  const cb = e.target.closest('input[type="checkbox"]'); if (!cb) return;
  coches[cb.dataset.k] = cb.checked;
  lsSet('liste-cochees', coches);
  cb.parentElement.querySelector('span').classList.toggle('done', cb.checked);
});

$('lBody').addEventListener('click', async e => {
  const ret = e.target.closest('[data-retirer]');
  if (ret) { togglePick(ret.dataset.retirer); return; }

  if (e.target.id === 'viderListe') {
    if (!confirm('Vider toute la liste de courses ?')) return;
    selection = []; saveSelection(); render(); renderListe();
    return;
  }
  if (e.target.id === 'cocherTout') {
    coches = {}; lsSet('liste-cochees', coches); renderListe();
    return;
  }
  if (e.target.id === 'copier') {
    const chosen = selection.map(id => state.recipes.find(r => r.id === id)).filter(Boolean);
    const texte = chosen.map(r => `${r.titre}\n` + (r.ingredients || []).map(i => `- ${i}`).join('\n')).join('\n\n');
    try {
      await navigator.clipboard.writeText(texte);
      $('copieMsg').textContent = 'Liste copiée ✓';
    } catch {
      $('copieMsg').textContent = 'Copie impossible sur ce navigateur.';
    }
  }
});

// ---- Détail ----
function openRecipe(id) {
  const r = state.recipes.find(x => x.id === id);
  if (!r) return;
  const picked = selection.includes(r.id);
  const ing = (r.ingredients || []).map((i, idx) => {
    const ok = !!coches[`${r.id}|${idx}`];
    return `<li><label>
      <input type="checkbox" data-idx="${idx}" data-id="${esc(r.id)}" ${ok ? 'checked' : ''}>
      <span class="${ok ? 'done' : ''}">${esc(i)}</span>
    </label></li>`;
  }).join('');
  const steps = (r.etapes || []).map(s => `<li><div>${esc(s)}</div></li>`).join('');
  const facts = [
    r.temps && `<div class="fact"><b>${esc(r.temps)} min</b><span>Temps</span></div>`,
    r.portions && `<div class="fact"><b>${esc(r.portions)}</b><span>Personnes</span></div>`,
    r.difficulte && `<div class="fact"><b>${esc(r.difficulte)}</b><span>Difficulté</span></div>`
  ].filter(Boolean).join('');
  const photo = r.image_url
    ? `<div class="dlg-photo"><img src="${esc(r.image_url)}" alt="${esc(r.titre)}"></div>`
    : `<div class="dlg-photo visu ${esc(r.type || 'sale')}">${emojiFor(r)}</div>`;

  $('dBody').innerHTML = `
    ${photo}
    <div class="dlg-head">
      <h2 id="dTitle">${esc(r.titre)}</h2>
      <button class="x" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <div class="badges">
      ${r.type ? `<span class="badge ${esc(r.type)}">${LABEL_TYPE[r.type] || ''}</span>` : ''}
      ${r.viande ? `<span class="badge">${LABEL_VIANDE[r.viande] || ''}</span>` : ''}
      ${r.cuisine ? `<span class="badge">${esc(r.cuisine)}</span>` : ''}
    </div>
    ${facts ? `<div class="facts">${facts}</div>` : ''}
    ${ing ? `<h3>Ingrédients</h3><ul class="ing">${ing}</ul>` : ''}
    ${steps ? `<h3>Étapes</h3><ol class="steps">${steps}</ol>` : ''}
    ${r.notes ? `<h3>Notes</h3><div class="notes">${esc(r.notes)}</div>` : ''}
    ${r.source ? `<a class="src" href="${esc(r.source)}" target="_blank" rel="noopener">Voir la source ↗</a>` : ''}
    <div class="dlg-foot">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn-etoile" type="button" data-etoile="${esc(r.id)}" aria-pressed="${estSouhait(r)}">${etoileLabel(r)}</button>
        <button class="btn-ajout" type="button" data-pick="${esc(r.id)}" aria-pressed="${picked}">${picked ? '✓ Dans la liste' : '+ Ajouter à la liste de courses'}</button>
      </div>
      <span class="hint">${r.ajoute_par ? 'Ajouté par ' + esc(r.ajoute_par) : ''}${r.created_at ? ' · ' + dateFr(r.created_at) : ''}</span>
    </div>`;
  $('detail').showModal();
}

$('dBody').addEventListener('change', e => {
  const cb = e.target.closest('input[type="checkbox"]'); if (!cb) return;
  const k = `${cb.dataset.id}|${cb.dataset.idx}`;
  coches[k] = cb.checked;
  lsSet('liste-cochees', coches);
  cb.parentElement.querySelector('span').classList.toggle('done', cb.checked);
});

$('dBody').addEventListener('click', e => {
  const et = e.target.closest('[data-etoile]');
  if (et) { toggleSouhait(et.dataset.etoile); return; }
  const p = e.target.closest('[data-pick]');
  if (!p) return;
  togglePick(p.dataset.pick);
  const picked = selection.includes(p.dataset.pick);
  p.setAttribute('aria-pressed', String(picked));
  p.textContent = picked ? '✓ Dans la liste' : '+ Ajouter à la liste de courses';
});

// Fermer les fenêtres via le bouton ✕ ou un clic sur le fond
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || e.target === d) d.close();
  });
});

// ---- Souhaits (étoiles, partagées entre les deux) ----
$('souhaitsOnly').addEventListener('click', e => {
  state.souhaitsOnly = !state.souhaitsOnly;
  e.currentTarget.setAttribute('aria-pressed', String(state.souhaitsOnly));
  render();
});

function monNom() {
  let nom = lsGet('mon-nom', '');
  if (!nom) {
    nom = (prompt('Ton prénom (pour tes étoiles) :') || '').trim();
    if (nom) lsSet('mon-nom', nom);
  }
  return nom;
}
function souhaitsDe(r) { return Array.isArray(r.souhaits) ? r.souhaits : []; }
function estSouhait(r) { const n = lsGet('mon-nom', ''); return !!n && souhaitsDe(r).includes(n); }
function etoileLabel(r) { const n = souhaitsDe(r).length; return (estSouhait(r) ? '★' : '☆') + (n ? ' ' + n : ''); }

async function toggleSouhait(id) {
  const r = state.recipes.find(x => x.id === id);
  if (!r) return;
  const nom = monNom();
  if (!nom) return;
  const avant = souhaitsDe(r).slice();
  const apres = avant.includes(nom) ? avant.filter(n => n !== nom) : [...avant, nom];
  r.souhaits = apres;
  render();
  majEtoileDetail(r);
  try {
    await api(`${TABLE}?id=eq.${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ souhaits: apres })
    });
  } catch (err) {
    r.souhaits = avant;
    render();
    majEtoileDetail(r);
    alert('Impossible d’enregistrer l’étoile : ' + err.message + '\n(La colonne « souhaits » existe-t-elle dans la base ?)');
  }
}

function majEtoileDetail(r) {
  const d = document.querySelector('#dBody [data-etoile]');
  if (d && d.dataset.etoile === r.id) {
    d.textContent = etoileLabel(r);
    d.setAttribute('aria-pressed', String(estSouhait(r)));
  }
}

// ---- Plat au hasard ----
$('hasard').addEventListener('click', () => {
  const sales = state.recipes.filter(r => r.type === 'sale');
  if (!sales.length) {
    alert('Aucun plat salé dans la base pour le moment.');
    return;
  }
  const r = sales[Math.floor(Math.random() * sales.length)];
  openRecipe(r.id);
});

// ---- Ajout ----
$('openAdd').addEventListener('click', () => {
  $('formMsg').className = 'msg';
  $('formMsg').textContent = '';
  $('addDlg').showModal();
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const titre = f.get('titre').trim();
  if (!titre) return;
  const data = {
    titre,
    type: f.get('type'),
    viande: f.get('viande'),
    cuisine: f.get('cuisine').trim().toLowerCase() || null,
    temps: Number(f.get('temps')) || null,
    portions: Number(f.get('portions')) || null,
    difficulte: f.get('difficulte') || null,
    ajoute_par: f.get('ajoute_par').trim() || null,
    source: f.get('source').trim() || null,
    ingredients: lines(f.get('ingredients')),
    etapes: lines(f.get('etapes')),
    notes: f.get('notes').trim() || null
  };
  // La photo n'est envoyée que si un lien est fourni
  const image = f.get('image_url').trim();
  if (image) data.image_url = image;

  const btn = $('save');
  btn.disabled = true;
  $('formMsg').className = 'msg';
  $('formMsg').textContent = 'Enregistrement…';
  try {
    await api(TABLE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(data)
    });
    e.target.reset();
    $('addDlg').close();
    await loadRecipes();
  } catch (err) {
    $('formMsg').className = 'msg err';
    $('formMsg').textContent = 'Erreur : ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// ---- Rafraîchissement : au chargement, au retour sur l'onglet, puis toutes les minutes ----
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRecipes(); });
setInterval(() => { if (!document.querySelector('dialog[open]')) loadRecipes(); }, 60000);
updateListeCount();
loadRecipes();
</script>
</body>
</html>
